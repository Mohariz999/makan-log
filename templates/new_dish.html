{% extends 'base.html' %}
{% block title %}Add a dish · Makan Log{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card"><div class="card-body">
      <h1 class="h4 mb-3">Add a dish</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label" for="stall">Stall</label>
            <input class="form-control" id="stall" name="stall" maxlength="120" required value="{{ form.get('stall', '') }}"></div>
          <div class="col-sm-6"><label class="form-label" for="hawker_centre">Hawker centre</label>
            <input class="form-control" id="hawker_centre" name="hawker_centre" maxlength="120" required list="centre-options"
                   value="{{ form.get('hawker_centre', '') }}">
            <datalist id="centre-options">{% for centre in centres %}<option value="{{ centre }}">{% endfor %}</datalist></div>
          <div class="col-sm-6"><label class="form-label" for="dish">Dish</label>
            <input class="form-control" id="dish" name="dish" maxlength="120" required value="{{ form.get('dish', '') }}"></div>
          <div class="col-sm-6"><label class="form-label" for="cuisine">Cuisine</label>
            <input class="form-control" id="cuisine" name="cuisine" maxlength="60" required placeholder="e.g. Malay" value="{{ form.get('cuisine', '') }}"></div>
          <div class="col-sm-6"><label class="form-label" for="price">Price (SGD)</label>
            <input class="form-control" id="price" name="price" type="number" min="0" max="100" step="0.01" required value="{{ form.get('price', '') }}"></div>
          <div class="col-sm-6"><label class="form-label" for="rating">Rating</label>
            <select class="form-select" id="rating" name="rating" required>
              {% for value in range(5, 0, -1) %}
                <option value="{{ value }}" {% if form.get('rating') == value|string %}selected{% endif %}>{{ '★' * value }}</option>
              {% endfor %}
            </select></div>
          <div class="col-12"><label class="form-label" for="notes">Notes (optional)</label>
            <input class="form-control" id="notes" name="notes" maxlength="300" value="{{ form.get('notes', '') }}"></div>
        </div>
        <button class="btn btn-primary w-100 mt-4">Save dish</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
